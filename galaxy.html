<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Hand Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 220px;
      border-radius: 18px;
      transform: scaleX(-1);
      opacity: 0.45;
      z-index: 10;
      border: 1px solid #ffffff33;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      color: white;
      padding: 15px 20px;
      border-radius: 15px;
      background: #0008;
      backdrop-filter: blur(10px);
    }

    #info h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    #status {
      color: #aaa;
      font-size: 13px;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #171044, #010107 70%);
    }

    #start button {
      padding: 18px 30px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
      box-shadow: 0 0 40px #8c5cff;
    }

    #help {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: #ffffff88;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="start">
    <button id="startButton">
      🌌 GALAKSİYİ BAŞLAT
    </button>

 <a style="color: aliceblue; ">Bu sayfaya giderseniz kameranız açılacaktır. Sorumluluk kabul etmeyiz...</a>

  </div>

  <div id="info">
    <h2>🌌 GALAXY CONTROL</h2>
    <h2><a href="index.html">🔙Geri dön</a></h2>
    <div id="status">Kamera bekleniyor...</div>
    <footer>© 2022 Ender.Code • Made with Mami77</footer>
  </div>

  <video id="camera" autoplay muted playsinline></video>

  <div id="help">
    ✋ Elini hareket ettir → Galaksiyi kontrol et.<br>
    🤏 Başparmak + işaret parmağı → Yaklaştır / uzaklaştır.
  </div>

  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- MEDIAPIPE -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


  <script>

    // ==========================================
    // THREE.JS
    // ==========================================

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

    camera.position.z = 11;


    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document.body.appendChild(renderer.domElement);


    // ==========================================
    // GALAXY
    // ==========================================

    const galaxy = new THREE.Group();

    scene.add(galaxy);


    // GALAXY CORE

    const coreGeometry =
      new THREE.SphereGeometry(
        1.3,
        64,
        64
      );

    const coreMaterial =
      new THREE.MeshBasicMaterial({
        color: 0xffd7a0
      });

    const core =
      new THREE.Mesh(
        coreGeometry,
        coreMaterial
      );

    galaxy.add(core);


    // ==========================================
    // GALAXY PARTICLES
    // ==========================================

    const particleCount = 18000;

    const geometry =
      new THREE.BufferGeometry();

    const positions =
      new Float32Array(
        particleCount * 3
      );


    for (
      let i = 0;
      i < particleCount;
      i++
    ) {

      const arm =
        i % 5;

      const radius =
        Math.pow(
          Math.random(),
          0.55
        ) * 6.5;

      const angle =
        radius * 1.35 +
        arm * Math.PI * 2 / 5 +
        (Math.random() - 0.5) * 0.65;


      const spread =
        (Math.random() - 0.5) *
        (0.35 + radius * 0.1);


      positions[i * 3] =
        Math.cos(angle) * radius +
        Math.cos(angle + Math.PI / 2) *
        spread;


      positions[i * 3 + 1] =
        (Math.random() - 0.5) *
        (0.5 + radius * 0.08);


      positions[i * 3 + 2] =
        Math.sin(angle) * radius +
        Math.sin(angle + Math.PI / 2) *
        spread;
    }


    geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,
        3
      )
    );


    const material =
      new THREE.PointsMaterial({

        color: 0xffb5ff,

        size: 0.035,

        transparent: true,

        opacity: 0.85

      });


    const particles =
      new THREE.Points(
        geometry,
        material
      );


    galaxy.add(particles);


    // ==========================================
    // GALAXY RINGS
    // ==========================================

    for (let i = 0; i < 4; i++) {

      const ringGeometry =
        new THREE.TorusGeometry(
          2.7 + i * 1.15,
          0.035,
          12,
          250
        );


      const ringMaterial =
        new THREE.MeshBasicMaterial({
          color:
            i % 2 === 0
              ? 0x8d7aff
              : 0x54d9ff,

          transparent: true,

          opacity: 0.45
        });


      const ring =
        new THREE.Mesh(
          ringGeometry,
          ringMaterial
        );


      ring.rotation.x =
        Math.PI / 2.2 +
        i * 0.15;


      galaxy.add(ring);
    }


    // ==========================================
    // STAR FIELD
    // ==========================================

    const starGeometry =
      new THREE.BufferGeometry();

    const starCount = 8000;

    const starPositions =
      new Float32Array(
        starCount * 3
      );


    for (
      let i = 0;
      i < starCount;
      i++
    ) {

      const radius =
        30 + Math.random() * 70;

      const angle =
        Math.random() *
        Math.PI *
        2;


      starPositions[i * 3] =
        Math.cos(angle) *
        radius;


      starPositions[i * 3 + 1] =
        (Math.random() - 0.5) *
        100;


      starPositions[i * 3 + 2] =
        Math.sin(angle) *
        radius;
    }


    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );


    const starMaterial =
      new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.045,

        transparent: true,

        opacity: 0.8

      });


    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );


    scene.add(stars);


    // ==========================================
    // HAND CONTROL VARIABLES
    // ==========================================

    let targetRotationX = 0;
    let targetRotationY = 0;

    let currentRotationX = 0;
    let currentRotationY = 0;

    let targetScale = 1;
    let currentScale = 1;


    // ==========================================
    // MEDIAPIPE
    // ==========================================

    const video =
      document.getElementById("camera");

    const status =
      document.getElementById("status");


    const hands =
      new Hands({
        locateFile: (file) => {

          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

        }
      });


    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });


    // ==========================================
    // HAND DETECTION
    // ==========================================

    hands.onResults((results) => {

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        const hand =
          results.multiHandLandmarks[0];


        // INDEX FINGER

        const index =
          hand[8];


        // THUMB

        const thumb =
          hand[4];


        // EL KONUMU

        const x =
          index.x;

        const y =
          index.y;


        // GALAKSİ ROTASYONU

        targetRotationY =
          (x - 0.5) * 5;


        targetRotationX =
          (y - 0.5) * 3;


        // ======================================
        // PINCH
        // ======================================

        const dx =
          index.x -
          thumb.x;

        const dy =
          index.y -
          thumb.y;


        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        targetScale =
          THREE.MathUtils.clamp(
            0.7 +
            distance * 5,
            0.7,
            2
          );


        status.innerText =
          "✋ El Algılandı.";

      }

      else {

        status.innerText =
          "✋ Elini kameraya göster.";

      }

    });


    // ==========================================
    // CAMERA
    // ==========================================

    let cameraController;


    async function startCamera() {

      try {

        status.innerText =
          "Kamera açılıyor...";


        const stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                width: 1280,

                height: 720,

                facingMode: "user"

              },

              audio: false

            });


        video.srcObject =
          stream;


        await video.play();


        cameraController =
          new Camera(
            video,
            {

              onFrame: async () => {

                await hands.send({
                  image: video
                });

              },

              width: 1280,

              height: 720

            }
          );


        cameraController.start();


        status.innerText =
          "✋ Elini kameraya göster.";


      }

      catch (error) {

        console.error(error);

        status.innerText =
          "❌ Kamera açılamadı.";

        alert(
          "Kamera açılamadı.\n\n" +
          "Chrome kullan ve kamera izni ver."
        );

      }

    }


    // ==========================================
    // START
    // ==========================================

    document
      .getElementById("startButton")
      .onclick = async () => {

        document
          .getElementById("start")
          .style.display = "none";

        await startCamera();

      };


    // ==========================================
    // ANIMATION
    // ==========================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      // SMOOTH HAND MOVEMENT

      currentRotationX +=
        (
          targetRotationX -
          currentRotationX
        ) * 0.08;


      currentRotationY +=
        (
          targetRotationY -
          currentRotationY
        ) * 0.08;


      currentScale +=
        (
          targetScale -
          currentScale
        ) * 0.08;


      // GALAXY

      galaxy.rotation.x =
        currentRotationX;


      galaxy.rotation.y +=
        0.002;


      galaxy.rotation.z =
        currentRotationY;


      galaxy.scale.setScalar(
        currentScale
      );


      // STAR MOVEMENT

      stars.rotation.y +=
        0.00015;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ==========================================
    // WINDOW RESIZE
    // ==========================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
