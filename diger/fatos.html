<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatoş 🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.center{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    pointer-events:none;
}

.center h1{
    color:#fff;
    font-size:clamp(35px,6vw,75px);
    letter-spacing:3px;
    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 30px rgba(255,255,255,.2);
    animation:breathe 3.5s ease-in-out infinite;
}

.center p{
    margin-top:12px;
    color:rgba(255,255,255,.55);
    letter-spacing:2px;
    font-size:15px;
    animation:fade 3s ease-in-out infinite alternate;
}

@keyframes breathe{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}

@keyframes fade{
    from{opacity:.25;}
    to{opacity:.75;}
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center">
    <h1>Fatoş 🤍</h1>
    <p>İyi ki varsın.</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

resize();
window.addEventListener("resize",resize);


/* ===========================
   SAKURA
=========================== */

const petals = [];

for(let i=0;i<45;i++){

    petals.push({
        x:Math.random()*W,
        y:Math.random()*H,
        size:Math.random()*7+4,
        speed:Math.random()*0.8+0.35,
        sway:Math.random()*Math.PI*2,
        swaySpeed:Math.random()*0.015+0.005,
        rotation:Math.random()*Math.PI*2,
        rotationSpeed:(Math.random()-0.5)*0.02,
        alpha:Math.random()*0.5+0.3
    });

}

function drawPetal(p){

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(p.rotation);

    ctx.globalAlpha=p.alpha;
    ctx.fillStyle="#f3b5c8";

    ctx.shadowColor="rgba(255,190,210,.6)";
    ctx.shadowBlur=8;

    let s=p.size;

    ctx.beginPath();

    ctx.moveTo(0,-s);

    ctx.bezierCurveTo(
        s,-s*.5,
        s,s*.55,
        0,s
    );

    ctx.bezierCurveTo(
        -s,s*.55,
        -s,-s*.5,
        0,-s
    );

    ctx.fill();

    ctx.restore();
}

function updatePetals(time){

    for(const p of petals){

        p.y+=p.speed;

        p.sway+=p.swaySpeed;

        p.x+=Math.sin(p.sway)*0.5;

        p.rotation+=p.rotationSpeed;

        if(p.y>H+30){
            p.y=-30;
            p.x=Math.random()*W;
        }

        if(p.x>W+30) p.x=-30;
        if(p.x<-30) p.x=W+30;
    }
}


/* ===========================
   KALP
=========================== */

function heartPoint(t,scale){

    const x=
        16*Math.pow(Math.sin(t),3);

    const y=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return{
        x:x*scale,
        y:-y*scale
    };
}

function heartAngle(t,scale){

    const a=heartPoint(t,scale);
    const b=heartPoint(t+0.01,scale);

    return Math.atan2(
        b.y-a.y,
        b.x-a.x
    );
}

function drawHeart(time){

    const centerX=W/2;
    const centerY=H/2;

    const base=Math.min(W,H)*0.024;

    const pulse=
        1+
        Math.sin(time*0.0015)*0.025;

    const scale=base*pulse;

    ctx.font="600 14px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    const text="FATOŞ 🤍";

    /*
      Kalbin çizgisi
    */

    const count=320;

    for(let i=0;i<count;i++){

        const t=
            (Math.PI*2/count)*i;

        const p=
            heartPoint(t,scale);

        const angle=
            heartAngle(t,scale);

        /*
          Yazıların çok hafif akması
        */

        const flow=
            Math.sin(
                time*0.0012+i*0.08
            )*0.7;

        const shine=
            0.55+
            (
                Math.sin(
                    time*0.002-i*0.08
                )+1
            )*.20;

        ctx.save();

        ctx.translate(
            centerX+p.x,
            centerY+p.y+flow
        );

        ctx.rotate(angle);

        ctx.globalAlpha=shine;

        ctx.fillStyle="#fff";

        ctx.shadowColor="#fff";
        ctx.shadowBlur=7;

        ctx.fillText(
            text,
            0,
            0
        );

        ctx.restore();
    }
}


/* ===========================
   MERKEZ IŞIĞI
=========================== */

function drawGlow(time){

    const pulse=
        1+
        Math.sin(time*0.0015)*0.06;

    const radius=
        90*pulse;

    const gradient=
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            radius
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,.08)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        W/2-radius,
        H/2-radius,
        radius*2,
        radius*2
    );
}


/* ===========================
   ANİMASYON
=========================== */

let start=performance.now();

function animate(now){

    const time=now-start;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /*
      Arka planda çok hafif ışık
    */

    const bg=
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            Math.min(W,H)*0.65
        );

    bg.addColorStop(
        0,
        "rgba(255,255,255,.025)"
    );

    bg.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    updatePetals(time);

    for(const p of petals){
        drawPetal(p);
    }

    drawGlow(time);
    drawHeart(time);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
